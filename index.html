<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Juros | Clicar Veículos</title><style>*{box-sizing:border-box}body{margin:0;padding:25px 16px;background:#f7f9f7;color:#18211b;font:16px system-ui,-apple-system,sans-serif}main{max-width:440px;margin:35px auto}.brand{font-size:12px;font-weight:800;color:#198e4c;letter-spacing:.14em}h1{font-size:30px;letter-spacing:-.04em;margin:10px 0 24px}.card{background:white;border:1px solid #e3e9e4;border-radius:18px;padding:24px;box-shadow:0 6px 25px #10201808}label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}.field{margin-bottom:20px}input,select{width:100%;font:inherit;padding:14px;border:1px solid #d6e1d9;border-radius:10px;background:#fff;color:#172019}hr{border:0;border-top:1px solid #e5ebe6;margin:22px 0}.muted{font-size:13px;color:#69766d}.big{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:5px 0 18px}.line{display:flex;justify-content:space-between;gap:15px;margin:12px 0;font-size:14px}.line b{font-size:15px}button{width:100%;border:0;border-radius:11px;background:#198d4b;color:white;font:inherit;font-weight:750;padding:15px;margin-top:15px;cursor:pointer}</style></head><body><main><div class="brand">CLICAR VEÍCULOS</div><h1>Calculadora de juros</h1><div class="card"><div class="field"><label for="valor">Valor (R$)</label><input id="valor" inputmode="decimal" value="1000,00"></div><div class="field"><label for="parcelas">Parcelas no cartão</label><select id="parcelas"></select></div><hr><div class="muted">Valor da parcela</div><div class="big" id="parcela"></div><div class="line"><span>Total com juros</span><b id="total"></b></div><div class="line"><span>Juros</span><b id="juros"></b></div><button id="copiar">Copiar resultado</button></div></main><script>const fatores=[1.025,0.5188,0.3501,0.2658,0.2152,0.1815,0.1575,0.1395,0.1255,0.1143,0.1051,0.0975];const $=id=>document.getElementById(id);const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});for(let n=1;n<=12;n++)$('parcelas').add(new Option(n+'x',n));let texto='';function calcular(){let s=$('valor').value.trim(),v=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s),n=Number($('parcelas').value);if(!(v>0)||!Number.isFinite(v)){for(let id of ['parcela','total','juros'])$(id).textContent='—';texto='';return}let p=v*fatores[n-1],t=p*n;$('parcela').textContent=brl(p);$('total').textContent=brl(t);$('juros').textContent=brl(t-v);texto='Valor: '+brl(v)+'\n'+n+'x de '+brl(p)+'\nTotal com juros: '+brl(t)+'\nJuros: '+brl(t-v)}$('valor').oninput=calcular;$('parcelas').onchange=calcular;$('copiar').onclick=async()=>{if(!texto)return;try{await navigator.clipboard.writeText(texto);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultado',1500)}catch{prompt('Copie o resultado:',texto)}};calcular()</script></body></html>
