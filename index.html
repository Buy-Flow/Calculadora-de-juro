<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101310"><title>Calculadora de Juros | Clicar Veículos</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 16px;background:#101310;color:#f5f7f5;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:450px;margin:25px auto}.brand{font-size:12px;font-weight:850;letter-spacing:.16em;color:#a4f64c}.brand:before{content:"";display:inline-block;width:9px;height:9px;background:#a4f64c;border-radius:50%;margin-right:9px}.title{font-size:32px;font-weight:850;letter-spacing:-.055em;margin:21px 0 27px}.card{background:#1a201b;border:1px solid #303b31;border-radius:24px;padding:23px;box-shadow:0 16px 50px #0003}.label{font-size:13px;color:#bdc9bd;font-weight:700;display:block;margin:0 0 10px}.field{margin-bottom:24px}.value{display:flex;align-items:center;background:#111712;border:1px solid #384639;border-radius:13px;padding:0 15px}.value:focus-within{border-color:#a4f64c}.value span{color:#96a899;font-size:15px;font-weight:750}.value input{background:transparent;color:white;border:0;outline:0;font:inherit;font-size:24px;font-weight:800;padding:16px 10px;width:100%;min-width:0}.accordion{border:1px solid #39483b;background:#111712;border-radius:13px;overflow:hidden}.toggle{width:100%;border:0;background:transparent;color:#f6faf6;font:inherit;font-size:16px;font-weight:750;padding:17px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.pill{display:flex;align-items:center;gap:12px;color:#a4f64c}.arrow{font-size:19px;transition:transform .2s}.accordion.open .arrow{transform:rotate(180deg)}.options{display:none;max-height:255px;overflow-y:auto;border-top:1px solid #29352b;padding:7px;scrollbar-color:#586f5b #111712}.accordion.open .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 12px;border:0;border-radius:9px;background:transparent;color:#d8e4da;font:inherit;font-weight:700;text-align:left;cursor:pointer}.opt[aria-pressed=true]{background:#263b29;color:#a4f64c}.opt[aria-pressed=true]:after{content:"✓"}.divider{border:0;border-top:1px solid #344036;margin:26px 0 22px}.hint{font-size:12px;color:#9daf9e;letter-spacing:.07em;text-transform:uppercase;font-weight:700}.big{font-size:38px;letter-spacing:-.055em;font-weight:850;color:#a4f64c;margin:8px 0 23px}.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#a6b5a8;margin:14px 0}.row b{color:#f5f8f5;font-size:15px}.copy{background:#a4f64c;color:#111711;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:850;margin-top:19px;cursor:pointer}@media(max-width:360px){.card{padding:17px}.big{font-size:32px}}</style></head><body><main class="wrap"><div class="brand">CLICAR VEÍCULOS</div><h1 class="title">Calculadora de juros</h1><section class="card"><div class="field"><label class="label" for="valor">Valor (R$)</label><div class="value"><span>R$</span><input id="valor" inputmode="decimal" value="1000,00"></div></div><div class="field"><div class="label">Quantidade de parcelas</div><div class="accordion" id="accordion"><button type="button" class="toggle" id="toggle" aria-expanded="false"><span>Parcelamento</span><span class="pill"><span id="selected">1x</span><span class="arrow">⌄</span></span></button><div id="options" class="options" role="group" aria-label="Parcelas de 1 a 21"></div></div></div><hr class="divider"><div class="hint">Valor da parcela</div><div class="big" id="parcela"></div><div class="row"><span>Total com juros</span><b id="total"></b></div><div class="row"><span>Juros</span><b id="juros"></b></div><button class="copy" id="copiar">Copiar resultado</button></section></main><script>const factors=[1.017,0.5127858205255329,0.3447303460930773,0.2607145462250117,0.2103146142834412,0.17672261427074631,0.15273514465831156,0.13475050434377578,0.12076774797017668,0.1095863080536628,0.10044218685977609,0.0928260523416381,0.08638528979901501,0.08086803139782159,0.0760895738818595,0.07191138964268669,0.06822754564721155,0.06495564938945111,0.0620306540154461,0.059400521910727436,0.05702312726281665],$=id=>document.getElementById(id),brl=x=>x.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let n=1,msg='';function setOpen(v){$('accordion').classList.toggle('open',v);$('toggle').setAttribute('aria-expanded',String(v))}$('toggle').onclick=()=>setOpen(!$('accordion').classList.contains('open'));for(let i=1;i<=21;i++){let b=document.createElement('button');b.className='opt';b.type='button';b.textContent=i+'x';b.setAttribute('aria-pressed',String(i===1));b.onclick=()=>{n=i;$('selected').textContent=i+'x';document.querySelectorAll('.opt').forEach((o,j)=>o.setAttribute('aria-pressed',String(j===i-1)));setOpen(false);calc()};$('options').appendChild(b)}function calc(){let s=$('valor').value.trim(),v=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);if(!Number.isFinite(v)||v<=0){for(let id of ['parcela','total','juros'])$(id).textContent='—';msg='';return}let p=v*factors[n-1],t=p*n;$('parcela').textContent=brl(p);$('total').textContent=brl(t);$('juros').textContent=brl(t-v);msg='Valor: '+brl(v)+'\n'+n+'x de '+brl(p)+'\nTotal com juros: '+brl(t)+'\nJuros: '+brl(t-v)}$('valor').oninput=calc;$('copiar').onclick=async()=>{if(!msg)return;try{await navigator.clipboard.writeText(msg);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultado',1500)}catch{prompt('Copie:',msg)}};calc()</script></body></html>
