<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101310"><title>Calculadora de Juros | Clicar Veículos</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 16px;background:#101310;color:#f5f7f5;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:450px;margin:25px auto}.brand{font-size:12px;font-weight:850;letter-spacing:.16em;color:#a4f64c}.brand:before{content:"";display:inline-block;width:9px;height:9px;background:#a4f64c;border-radius:50%;margin-right:9px}.title{font-size:32px;font-weight:850;letter-spacing:-.055em;margin:21px 0 27px}.card{background:#1a201b;border:1px solid #303b31;border-radius:24px;padding:23px;box-shadow:0 16px 50px #0003}.label{font-size:13px;color:#bdc9bd;font-weight:700;display:block;margin:0 0 10px}.field{margin-bottom:24px}.value{display:flex;align-items:center;background:#111712;border:1px solid #384639;border-radius:13px;padding:0 15px}.value:focus-within{border-color:#a4f64c}.value span{color:#96a899;font-size:15px;font-weight:750}.value input{background:transparent;color:white;border:0;outline:0;font:inherit;font-size:24px;font-weight:800;padding:16px 10px;width:100%;min-width:0}.accordion{border:1px solid #39483b;background:#111712;border-radius:13px;overflow:hidden}.toggle{width:100%;border:0;background:transparent;color:#f6faf6;font:inherit;font-size:16px;font-weight:750;padding:17px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.pill{display:flex;align-items:center;gap:12px;color:#a4f64c}.arrow{font-size:19px;transition:transform .2s}.accordion.open .arrow{transform:rotate(180deg)}.options{display:none;max-height:255px;overflow-y:auto;border-top:1px solid #29352b;padding:7px;scrollbar-color:#586f5b #111712}.accordion.open .options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 7px;border:0;border-radius:9px;background:transparent;color:#d8e4da;font:inherit;font-weight:700;text-align:left;cursor:pointer}.opt[aria-pressed=true]{background:#263b29;color:#a4f64c}.opt[aria-pressed=true]:after{content:"✓"}.divider{border:0;border-top:1px solid #344036;margin:26px 0 22px}.hint{font-size:12px;color:#9daf9e;letter-spacing:.07em;text-transform:uppercase;font-weight:700}.big{font-size:38px;letter-spacing:-.055em;font-weight:850;color:#a4f64c;margin:8px 0 23px}.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#a6b5a8;margin:14px 0}.row b{color:#f5f8f5;font-size:15px}.copy{background:#a4f64c;color:#111711;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:850;margin-top:19px;cursor:pointer}@media(max-width:360px){.card{padding:17px}.big{font-size:32px}} .save{width:100%;background:#263b29;color:#a4f64c;border:1px solid #48674c;border-radius:12px;padding:14px;font:inherit;font-weight:800;margin-top:10px;cursor:pointer}.history{margin-top:20px;background:#1a201b;border:1px solid #303b31;border-radius:22px;padding:20px}.history h2{font-size:19px;letter-spacing:-.025em;margin:0 0 6px}.history .help{font-size:12px;color:#a1b0a3;margin:0 0 17px}.saved{border:1px solid #334336;background:#111712;border-radius:12px;padding:13px;margin:10px 0}.savedtop{display:flex;gap:8px;align-items:center;justify-content:space-between}.savedtop label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:750}.savedtop input{accent-color:#a4f64c;width:18px;height:18px}.savedmeta{color:#9fb1a3;font-size:12px;margin:8px 0}.savedprice{font-size:17px;color:#a4f64c;font-weight:850}.actions{display:flex;gap:8px;margin-top:12px}.mini{border:1px solid #415645;background:#233026;color:#e5f2e7;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.mini.danger{color:#e9a9a9;background:transparent;border-color:#574141}.compare{overflow-x:auto;margin-top:15px}.compare table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}.compare th,.compare td{padding:10px 8px;text-align:left;border-bottom:1px solid #334336}.compare th{color:#a4f64c}.empty{color:#93a497;font-size:13px;padding:12px 0}@media(max-width:350px){.history{padding:15px}} </style></head><body><main class="wrap"><div class="brand">CLICAR VEÍCULOS</div><h1 class="title">Calculadora de juros</h1><section class="card"><div class="field"><label class="label" for="valor">Valor (R$)</label><div class="value"><span>R$</span><input id="valor" inputmode="decimal" value="1000,00"></div></div><div class="field"><div class="label">Quantidade de parcelas</div><div class="accordion" id="accordion"><button type="button" class="toggle" id="toggle" aria-expanded="false"><span>Parcelamento</span><span class="pill"><span id="selected">1x</span><span class="arrow">⌄</span></span></button><div id="options" class="options" role="group" aria-label="Parcelas de 1 a 21"></div></div></div><hr class="divider"><div class="hint">Valor da parcela</div><div class="big" id="parcela"></div><div class="row"><span>Total com juros</span><b id="total"></b></div><div class="row"><span>Juros</span><b id="juros"></b></div><button class="copy" id="copiar">Copiar resultado</button><button class="save" id="salvar">Salvar simulação</button></section><section class="history"><h2>Histórico</h2><p class="help">Salve simulações e marque até 3 para comparar.</p><div id="lista"></div><div id="comparacao" class="compare"></div></section></main><script>const factors=[1.017,0.5127858205255329,0.3447303460930773,0.2607145462250117,0.2103146142834412,0.17672261427074631,0.15273514465831156,0.13475050434377578,0.12076774797017668,0.1095863080536628,0.10044218685977609,0.0928260523416381,0.08638528979901501,0.08086803139782159,0.0760895738818595,0.07191138964268669,0.06822754564721155,0.06495564938945111,0.0620306540154461,0.059400521910727436,0.05702312726281665],$=id=>document.getElementById(id),brl=x=>x.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let n=1,msg='',atual=null;const chave='clicar-simulacoes-v1';let historico=[];try{historico=JSON.parse(localStorage.getItem(chave)||'[]');if(!Array.isArray(historico))historico=[]}catch{historico=[]}let selecionados=[];function persistir(){try{localStorage.setItem(chave,JSON.stringify(historico))}catch{alert('Não foi possível salvar neste navegador.')}}function setOpen(v){$('accordion').classList.toggle('open',v);$('toggle').setAttribute('aria-expanded',String(v))}$('toggle').onclick=()=>setOpen(!$('accordion').classList.contains('open'));for(let i=1;i<=21;i++){let b=document.createElement('button');b.className='opt';b.type='button';b.textContent=i+'x';b.setAttribute('aria-pressed',String(i===1));b.onclick=()=>{n=i;$('selected').textContent=i+'x';document.querySelectorAll('.opt').forEach((o,j)=>o.setAttribute('aria-pressed',String(j===i-1)));setOpen(false);calc()};$('options').appendChild(b)}function formatarValor(){const input=$('valor');let digitos=input.value.replace(/\D/g,'').slice(0,13);let centavos=Number(digitos||'0');input.value=(centavos/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});calc()}function calc(){let s=$('valor').value.trim(),v=Number(s.replace(/\./g,'').replace(',','.'));if(!Number.isFinite(v)||v<=0){for(let id of ['parcela','total','juros'])$(id).textContent='—';msg='';atual=null;return}let p=v*factors[n-1],t=p*n;$('parcela').textContent=brl(p);$('total').textContent=brl(t);$('juros').textContent=brl(t-v);atual={valor:v,parcelas:n,parcela:p,total:t,juros:t-v};msg='Valor: '+brl(v)+'\n'+n+'x de '+brl(p)+'\nTotal com juros: '+brl(t)+'\nJuros: '+brl(t-v)}$('valor').oninput=formatarValor;$('copiar').onclick=async()=>{if(!msg)return;try{await navigator.clipboard.writeText(msg);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultado',1500)}catch{prompt('Copie:',msg)}};$('salvar').onclick=()=>{if(!atual)return;const item={...atual,id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),data:new Date().toLocaleDateString('pt-BR')};historico.unshift(item);historico=historico.slice(0,50);persistir();renderizar();$('salvar').textContent='Salvo!';setTimeout(()=>$('salvar').textContent='Salvar simulação',1400)};function carregar(item){n=item.parcelas;$('selected').textContent=n+'x';document.querySelectorAll('.opt').forEach((o,j)=>o.setAttribute('aria-pressed',String(j===n-1)));$('valor').value=item.valor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});setOpen(false);calc();window.scrollTo({top:0,behavior:'smooth'})}function renderizar(){const lista=$('lista');lista.replaceChildren();if(!historico.length){const p=document.createElement('div');p.className='empty';p.textContent='Nenhuma simulação salva ainda.';lista.append(p)}for(const item of historico){const card=document.createElement('div');card.className='saved';const top=document.createElement('div');top.className='savedtop';const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=selecionados.includes(item.id);cb.onchange=()=>{if(cb.checked){if(selecionados.length>=3){cb.checked=false;return alert('Selecione no máximo 3 simulações.')}selecionados.push(item.id)}else selecionados=selecionados.filter(id=>id!==item.id);renderizar()};label.append(cb,document.createTextNode(item.parcelas+'x · '+brl(item.valor)));const date=document.createElement('span');date.className='savedmeta';date.textContent=item.data;top.append(label,date);const price=document.createElement('div');price.className='savedprice';price.textContent=brl(item.parcela)+' / parcela';const meta=document.createElement('div');meta.className='savedmeta';meta.textContent='Total '+brl(item.total)+' · Juros '+brl(item.juros);const actions=document.createElement('div');actions.className='actions';const use=document.createElement('button');use.className='mini';use.textContent='Reabrir';use.onclick=()=>carregar(item);const del=document.createElement('button');del.className='mini danger';del.textContent='Excluir';del.onclick=()=>{historico=historico.filter(x=>x.id!==item.id);selecionados=selecionados.filter(id=>id!==item.id);persistir();renderizar()};actions.append(use,del);card.append(top,price,meta,actions);lista.append(card)}const comp=$('comparacao');comp.replaceChildren();const items=selecionados.map(id=>historico.find(x=>x.id===id)).filter(Boolean);if(items.length>=2){const table=document.createElement('table');const rows=[['Comparação',...items.map(x=>x.parcelas+'x')],['Valor',...items.map(x=>brl(x.valor))],['Parcela',...items.map(x=>brl(x.parcela))],['Total',...items.map(x=>brl(x.total))],['Juros',...items.map(x=>brl(x.juros))]];rows.forEach((cells,i)=>{const tr=document.createElement('tr');cells.forEach(t=>{const el=document.createElement(i===0?'th':'td');el.textContent=t;tr.append(el)});table.append(tr)});comp.append(table)}}calc();renderizar()</script></body></html>
