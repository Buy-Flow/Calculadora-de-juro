<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Calculadora de Juros | Clicar Veículos</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#151a17;background:#f6f7f6}*{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:490px;margin:24px auto}.brand{font-size:13px;letter-spacing:.13em;font-weight:800;color:#168344;text-transform:uppercase}.heading{font-size:30px;letter-spacing:-.045em;margin:10px 0 8px}p{color:#69716c;line-height:1.5}.panel{background:#fff;border:1px solid #e6eae7;border-radius:20px;padding:23px;margin-top:22px;box-shadow:0 5px 30px #16251b08}label{display:block;font-weight:650;font-size:13px;margin:0 0 8px}.field{margin-bottom:19px}input,select{width:100%;border:1px solid #dce3dd;background:#fff;border-radius:11px;padding:14px 13px;font:inherit;color:#141a15;outline-color:#1b9b51}button{width:100%;border:0;border-radius:11px;padding:15px;font:inherit;font-weight:750;cursor:pointer}.primary{background:#168744;color:#fff}.secondary{background:#eef6f0;color:#187f42;margin-top:10px}.result{border-top:1px solid #e9ede9;padding-top:19px;margin-top:5px}.small{color:#727a74;font-size:13px}.amount{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:6px 0 15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:#f6f8f6;padding:12px;border-radius:10px}.stat b{display:block;margin-top:4px;font-size:15px}.note{font-size:12px;margin-top:15px}.error{color:#bb3434;font-size:13px;min-height:18px}</style></head><body><main class="wrap"><div class="brand">Clicar Veículos</div><h1 class="heading">Calculadora de juros</h1><p>Simule vendas no cartão em poucos segundos e compartilhe com o cliente.</p><section class="panel"><div class="field"><label for="valor">Valor da venda (R$)</label><input id="valor" inputmode="decimal" value="1000" placeholder="Ex.: 1000,00"></div><div class="field"><label for="taxa">Taxa de juros ao mês (%)</label><input id="taxa" inputmode="decimal" value="2,5" placeholder="Ex.: 2,5"></div><div class="field"><label for="parcelas">Quantidade de parcelas</label><select id="parcelas"></select></div><div class="field"><label for="tipo">Tipo de cálculo</label><select id="tipo"><option value="price">Parcelas fixas (Tabela Price)</option><option value="simples">Juros simples sobre o valor</option><option value="compostos">Juros compostos sobre o valor</option></select></div><div class="error" id="erro" aria-live="polite"></div><div class="result"><div class="small">Valor de cada parcela</div><div class="amount" id="mensal">R$ 0,00</div><div class="stats"><div class="stat"><span class="small">Total cobrado</span><b id="total">R$ 0,00</b></div><div class="stat"><span class="small">Total de juros</span><b id="juros">R$ 0,00</b></div></div><button class="primary" id="copiar">Copiar simulação</button><button class="secondary" id="whatsapp">Enviar pelo WhatsApp</button></div></section><p class="note">Simulação informativa. Confirme as taxas e regras da operadora do cartão antes de fechar a venda.</p></main><script>
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),num=s=>Number(String(s).trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.'));for(let i=1;i<=24;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'x';if(i===12)o.selected=true;$('parcelas').append(o)}let texto='';function calcular(){let v=num($('valor').value),t=num($('taxa').value)/100,n=Number($('parcelas').value),tipo=$('tipo').value;if(!Number.isFinite(v)||v<=0||!Number.isFinite(t)||t<0||t>1){$('erro').textContent='Informe um valor e uma taxa válidos.';return}$('erro').textContent='';let total,parcela;if(tipo==='price'){parcela=t===0?v/n:v*t/(1-Math.pow(1+t,-n));total=parcela*n}else{total=tipo==='simples'?v*(1+t*n):v*Math.pow(1+t,n);parcela=total/n}let juros=total-v;$('mensal').textContent=fmt(parcela);$('total').textContent=fmt(total);$('juros').textContent=fmt(juros);let modalidade=tipo==='price'?'parcelas fixas (Price)':tipo==='simples'?'juros simples':'juros compostos';texto='*Simulação | Clicar Veículos*\nValor: '+fmt(v)+'\nParcelamento: '+n+'x de '+fmt(parcela)+'\nTaxa: '+(t*100).toLocaleString('pt-BR')+'% a.m.\nModalidade: '+modalidade+'\nTotal: '+fmt(total)+'\nJuros: '+fmt(juros)+'\n\nValores sujeitos à confirmação.'}['valor','taxa','parcelas','tipo'].forEach(id=>$(id).addEventListener('input',calcular));$('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(texto);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar simulação',1600)}catch(e){prompt('Copie a simulação:',texto)}};$('whatsapp').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(texto),'_blank');calcular();
</script></body></html>
