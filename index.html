<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f7"><title>Calculadora de juros | Clicar Veículos</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#1c241f;background:#f7f8f7}*{box-sizing:border-box}body{margin:0;padding:22px 16px}.app{max-width:450px;margin:20px auto}.brand{font-size:11px;letter-spacing:.18em;color:#168a48;font-weight:850}.heading{font-size:30px;font-weight:800;letter-spacing:-.05em;margin:9px 0 22px}.card{background:#fff;border:1px solid #e6ebe7;border-radius:22px;padding:22px;box-shadow:0 14px 40px #18352308}.label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}input{width:100%;border:1px solid #dbe4de;background:#fff;border-radius:12px;padding:15px;font:inherit;font-size:22px;font-weight:700;outline-color:#168a48}.field{margin-bottom:24px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.choice{border:1px solid #e2e9e4;background:#f8faf8;border-radius:11px;padding:12px 0;color:#455148;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s}.choice[aria-pressed="true"]{background:#e9f7ee;border:1.5px solid #168a48;color:#11783b}.divider{height:1px;background:#edf0ed;margin:25px 0 20px}.hint{color:#6d7970;font-size:13px}.big{font-size:36px;font-weight:850;letter-spacing:-.055em;margin:6px 0 22px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:13px 0;font-size:14px;color:#6a746d}.line strong{color:#1c241f;font-size:15px}.copy{width:100%;border:0;border-radius:12px;background:#168a48;color:#fff;font:inherit;font-weight:750;padding:15px;margin-top:16px;cursor:pointer}.copy:active{background:#116f3a}@media(max-width:350px){.card{padding:17px}.choices{gap:6px}.choice{padding:10px 0}.big{font-size:30px}}</style></head>
<body><main class="app"><div class="brand">CLICAR VEÍCULOS</div><h1 class="heading">Calculadora de juros</h1><section class="card"><div class="field"><label class="label" for="valor">Valor (R$)</label><input id="valor" inputmode="decimal" value="1000,00" aria-label="Valor da venda"></div><div><div class="label">Parcelas no cartão</div><div id="choices" class="choices" role="group" aria-label="Quantidade de parcelas"></div></div><div class="divider"></div><div class="hint">Valor da parcela</div><div class="big" id="parcela">R$ 0,00</div><div class="line"><span>Total com juros</span><strong id="total">R$ 0,00</strong></div><div class="line"><span>Juros</span><strong id="juros">R$ 0,00</strong></div><button class="copy" id="copiar">Copiar resultado</button></section></main>
<script>const fatores=[1.025,0.5188,0.3501,0.2658,0.2152,0.1815,0.1575,0.1395,0.1255,0.1143,0.1051,0.0975],$=id=>document.getElementById(id),brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let n=1,msg='';for(let i=1;i<=12;i++){const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=i+'x';b.setAttribute('aria-pressed',i===1?'true':'false');b.onclick=()=>{n=i;document.querySelectorAll('.choice').forEach((e,j)=>e.setAttribute('aria-pressed',j===i-1?'true':'false'));calcular()};$('choices').append(b)}function calcular(){let s=$('valor').value.trim(),v=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);if(!(v>0)||!Number.isFinite(v)){for(let id of ['parcela','total','juros'])$(id).textContent='—';msg='';return}const p=v*fatores[n-1],total=p*n;$('parcela').textContent=brl(p);$('total').textContent=brl(total);$('juros').textContent=brl(total-v);msg='Valor: '+brl(v)+'\n'+n+'x de '+brl(p)+'\nTotal com juros: '+brl(total)+'\nJuros: '+brl(total-v)}$('valor').addEventListener('input',calcular);$('copiar').onclick=async()=>{if(!msg)return;try{await navigator.clipboard.writeText(msg);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultado',1600)}catch{prompt('Copie o resultado:',msg)}};calcular();</script></body></html>
