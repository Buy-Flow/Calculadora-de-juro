<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0d0b"><title>Calculadora de Juros | Clicar Veículos</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#f4f8f5;background:#0a0d0b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 85% 35% at 50% -10%,#193b26 0%,transparent 75%),#0a0d0b;padding:25px 16px}.app{max-width:440px;margin:20px auto}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:850;letter-spacing:.14em}.brandmark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#a3ff46;color:#101610;font-size:21px;font-weight:950;letter-spacing:-.1em}.brand span:last-child{color:#e7f0e9}h1{font-size:31px;line-height:1.1;letter-spacing:-.055em;margin:25px 0 8px;font-weight:850}.subtitle{font-size:14px;color:#89998e;margin:0 0 25px}.card{background:#151b17;border:1px solid #2b382e;border-radius:23px;padding:22px;box-shadow:0 22px 55px #0005}.label{display:block;font-size:13px;font-weight:700;margin:0 0 9px;color:#cdd9cf}.field{margin-bottom:23px}.valuewrap{display:flex;align-items:center;background:#0c120e;border:1px solid #334337;border-radius:13px;padding:0 15px}.currency{font-size:15px;font-weight:750;color:#92a998}.valuewrap input{min-width:0;width:100%;padding:17px 10px;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:24px;font-weight:800;letter-spacing:-.03em}.valuewrap:focus-within{border-color:#a3ff46}.accordion{border:1px solid #334337;background:#0c120e;border-radius:13px;overflow:hidden}.trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;color:#f4f8f5;border:0;padding:16px;font:inherit;font-weight:750;text-align:left;cursor:pointer}.trigger strong{color:#a3ff46;font-size:17px}.chevron{color:#a3ff46;font-size:20px;transition:transform .2s}.accordion.open .chevron{transform:rotate(180deg)}.options{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 14px}.accordion.open .options{display:grid}.option{padding:12px 0;border-radius:10px;border:1px solid #2d3b31;background:#1a251d;color:#d2ded5;font:inherit;font-size:14px;font-weight:750;cursor:pointer}.option[aria-pressed=true]{background:#a3ff46;color:#0b160e;border-color:#a3ff46}.divider{height:1px;background:#2c382f;margin:25px 0 20px}.hint{font-size:12px;font-weight:700;color:#98ac9c;text-transform:uppercase;letter-spacing:.09em}.big{font-size:38px;font-weight:850;letter-spacing:-.055em;margin:7px 0 22px;color:#a3ff46}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0;color:#a3b2a6;font-size:14px}.line strong{font-size:15px;color:#f0f7f1}.copy{width:100%;margin-top:18px;background:#a3ff46;color:#0b160e;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:850;cursor:pointer}.copy:active{background:#8ce53a}@media(max-width:360px){.card{padding:17px}.big{font-size:32px}}</style></head><body><main class="app"><div class="brand"><span class="brandmark">C</span><span>CLICAR VEÍCULOS</span></div><h1>Calculadora de juros</h1><p class="subtitle">Cartão de crédito · Taxas fixas</p><section class="card"><div class="field"><label class="label" for="valor">Valor</label><div class="valuewrap"><span class="currency">R$</span><input id="valor" inputmode="decimal" value="1000,00" aria-label="Valor da venda"></div></div><div class="field"><div class="label">Parcelas no cartão</div><div class="accordion" id="accordion"><button class="trigger" type="button" id="trigger" aria-expanded="false" aria-controls="options"><span>Selecionar parcelas</span><span><strong id="selected">1x</strong> <span class="chevron">⌄</span></span></button><div class="options" id="options" role="group" aria-label="Quantidade de parcelas"></div></div></div><div class="divider"></div><div class="hint">Valor da parcela</div><div class="big" id="parcela"></div><div class="line"><span>Total com juros</span><strong id="total"></strong></div><div class="line"><span>Juros</span><strong id="juros"></strong></div><button class="copy" id="copiar">Copiar resultado</button></section></main><script>const fatores=[1.025,0.5188,0.3501,0.2658,0.2152,0.1815,0.1575,0.1395,0.1255,0.1143,0.1051,0.0975],$=id=>document.getElementById(id),brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let n=1,msg='';function toggle(open){$('accordion').classList.toggle('open',open);$('trigger').setAttribute('aria-expanded',String(open))}$('trigger').onclick=()=>toggle(!$('accordion').classList.contains('open'));for(let i=1;i<=12;i++){const b=document.createElement('button');b.className='option';b.type='button';b.textContent=i+'x';b.setAttribute('aria-pressed',String(i===1));b.onclick=()=>{n=i;$('selected').textContent=i+'x';document.querySelectorAll('.option').forEach((e,j)=>e.setAttribute('aria-pressed',String(j===i-1)));toggle(false);calcular()};$('options').append(b)}function calcular(){let s=$('valor').value.trim(),v=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);if(!(v>0)||!Number.isFinite(v)){for(let id of ['parcela','total','juros'])$(id).textContent='—';msg='';return}let p=v*fatores[n-1],total=p*n;$('parcela').textContent=brl(p);$('total').textContent=brl(total);$('juros').textContent=brl(total-v);msg='Valor: '+brl(v)+'\n'+n+'x de '+brl(p)+'\nTotal com juros: '+brl(total)+'\nJuros: '+brl(total-v)}$('valor').addEventListener('input',calcular);$('copiar').onclick=async()=>{if(!msg)return;try{await navigator.clipboard.writeText(msg);$('copiar').textContent='Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultado',1500)}catch{prompt('Copie o resultado:',msg)}};calcular()</script></body></html>
